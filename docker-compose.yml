# docker compose up --build    then open http://localhost:8000  (admin / docflow-demo)
x-app: &app
  build: .
  env_file: .env.example
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-secret-change-me}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    DATABASE_URL: postgres://docflow:docflow@db:5432/docflow
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /data/media
  volumes:
    - media:/data/media
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}

services:
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports: ["8000:8000"]

  worker:
    <<: *app
    # one OCR job per process; scale with: docker compose up --scale worker=3
    command: celery -A config worker --loglevel=info --concurrency=1

  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: docflow, POSTGRES_USER: docflow, POSTGRES_PASSWORD: docflow}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U docflow"], interval: 3s, retries: 20}

  redis:
    image: redis:7-alpine

volumes:
  media:
  pgdata:
