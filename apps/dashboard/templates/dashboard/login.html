{% extends "dashboard/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="panel login">
  <h1>Sign in</h1>
  <p class="sub">OCR + rules for business documents.</p>
  {% if form.errors %}<ul class="msgs"><li class="error">Wrong username or password.</li></ul>{% endif %}
  <form method="post">{% csrf_token %}
    <label for="id_username">Username</label><input type="text" name="username" id="id_username" autofocus required>
    <label for="id_password">Password</label><input type="password" name="password" id="id_password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <p><button class="btn primary" type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
